name: Build Lathe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      # MP3 export: the official LAME 3.100 release source (LGPL), checked against its SHA-512.
      - name: Fetch the LAME MP3 encoder source
        run: |
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/lame.tar.gz" "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz"
          echo "0844b9eadb4aacf8000444621451277de365041cc1d97b7f7a589da0b7a23899310afd4e4d81114b9912aa97832621d20588034715573d417b2923948c08634b  $RUNNER_TEMP/lame.tar.gz" | shasum -a 512 -c -
          tar -xzf "$RUNNER_TEMP/lame.tar.gz" -C "$RUNNER_TEMP"

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DLATHE_LAME_SOURCE="$RUNNER_TEMP/lame-3.100"

      - name: Build
        run: cmake --build build --config Release -- -quiet

      - name: Run tests
        env:
          LATHE_SCAN_LOG: ${{ runner.temp }}/scan.log
        run: ctest --test-dir build -C Release --output-on-failure -E scan

      - name: Crash backtrace (only when a test failed)
        if: failure()
        run: |
          for name in lathe_render_tests lathe_batch_tests lathe_ui_tests; do
            T=$(find build -name "$name" -type f -perm -u+x | grep Release | head -1)
            echo "==== $name"
            lldb --batch -o run -k "bt 40" -k "frame variable" -k quit -- "$T" 2>&1 | tail -120
          done

      - name: Scan helper test (console helper)
        continue-on-error: true
        env:
          LATHE_SCAN_LOG: ${{ runner.temp }}/scan.log
        run: ctest --test-dir build -C Release --output-on-failure -R scan

      - name: Scan helper test (the app as helper)
        env:
          LATHE_SCAN_LOG: ${{ runner.temp }}/scan-app.log
        run: |
          APP=$(find build -name "Lathe.app" -type d | grep Release | head -1)
          T=$(find build -name "lathe_scan_tests" -type f -perm -u+x | grep Release | head -1)
          "$T" --helper "$APP/Contents/MacOS/Lathe"

      - name: Scan protocol trace
        if: always()
        run: |
          cat "${{ runner.temp }}/scan.log" || true
          echo "---- app as helper ----"
          cat "${{ runner.temp }}/scan-app.log" || true

      - name: Package
        run: |
          APP=$(find build -name "Lathe.app" -type d | grep Release | head -1)
          # The MP3 encoder must be inside the app, for both kinds of Mac.
          test -x "$APP/Contents/Resources/lame"
          lipo -info "$APP/Contents/Resources/lame" | grep -q "x86_64 arm64\|arm64 x86_64"
          "$APP/Contents/Resources/lame" --version | head -1
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/Lathe-mac.zip
          ls -la dist
          lipo -info "$APP/Contents/MacOS/Lathe"
          vtool -show-build "$APP/Contents/MacOS/Lathe" | grep -E "minos|sdk"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: Lathe-mac
          path: dist/Lathe-mac.zip

      - name: Publish to builds branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp dist/Lathe-mac.zip /tmp/
          git fetch origin builds || true
          git checkout --orphan builds-new
          git rm -rf --quiet . || true
          cp /tmp/Lathe-mac.zip .
          echo "Built from ${GITHUB_SHA} on $(date -u)" > BUILD_INFO.txt
          git add Lathe-mac.zip BUILD_INFO.txt
          git commit -m "Build ${GITHUB_SHA::7}"
          git push --force origin builds-new:builds
