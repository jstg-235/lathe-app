name: Build Lathe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        run: cmake --build build --config Release -- -quiet

      - name: Run tests
        env:
          LATHE_SCAN_LOG: ${{ runner.temp }}/scan.log
        run: ctest --test-dir build -C Release --output-on-failure -E scan

      - name: Crash backtrace (only when a test failed)
        if: failure()
        run: |
          for name in lathe_render_tests lathe_batch_tests; do
            T=$(find build -name "$name" -type f -perm -u+x | grep Release | head -1)
            echo "==== $name"
            lldb --batch -o run -k "bt 40" -k "frame variable" -k quit -- "$T" 2>&1 | tail -120
          done

      - name: Scan helper test (console helper)
        continue-on-error: true
        env:
          LATHE_SCAN_LOG: ${{ runner.temp }}/scan.log
        run: ctest --test-dir build -C Release --output-on-failure -R scan

      - name: Scan helper test (the app as helper)
        env:
          LATHE_SCAN_LOG: ${{ runner.temp }}/scan-app.log
        run: |
          APP=$(find build -name "Lathe.app" -type d | grep Release | head -1)
          T=$(find build -name "lathe_scan_tests" -type f -perm -u+x | grep Release | head -1)
          "$T" --helper "$APP/Contents/MacOS/Lathe"

      - name: Scan protocol trace
        if: always()
        run: |
          cat "${{ runner.temp }}/scan.log" || true
          echo "---- app as helper ----"
          cat "${{ runner.temp }}/scan-app.log" || true

      - name: Package
        run: |
          APP=$(find build -name "Lathe.app" -type d | grep Release | head -1)
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/Lathe-mac.zip
          ls -la dist
          lipo -info "$APP/Contents/MacOS/Lathe"
          vtool -show-build "$APP/Contents/MacOS/Lathe" | grep -E "minos|sdk"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: Lathe-mac
          path: dist/Lathe-mac.zip

      - name: Publish to builds branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp dist/Lathe-mac.zip /tmp/
          git fetch origin builds || true
          git checkout --orphan builds-new
          git rm -rf --quiet . || true
          cp /tmp/Lathe-mac.zip .
          echo "Built from ${GITHUB_SHA} on $(date -u)" > BUILD_INFO.txt
          git add Lathe-mac.zip BUILD_INFO.txt
          git commit -m "Build ${GITHUB_SHA::7}"
          git push --force origin builds-new:builds
